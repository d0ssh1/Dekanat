# Продакшен на одном сервере: БД + миграции + приложение + Caddy (HTTPS).
# Секреты — в файле .env рядом (не в git): DB_OWNER_PASSWORD, APP_DB_PASSWORD, DOMAIN, GIGACHAT_AUTH_KEY…
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dekanat
      POSTGRES_USER: dekanat_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?нужен DB_OWNER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dekanat_owner -d dekanat']
      interval: 3s
      retries: 30

  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_OWNER_URL: postgres://dekanat_owner:${DB_OWNER_PASSWORD}@db:5432/dekanat
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?нужен APP_DB_PASSWORD}
      RUN_SEED: ${RUN_SEED:-0}
      SEED_PASSWORD_STUDENT1: ${SEED_PASSWORD_STUDENT1:-}
      SEED_PASSWORD_STUDENT2: ${SEED_PASSWORD_STUDENT2:-}
      SEED_PASSWORD_STAFF: ${SEED_PASSWORD_STAFF:-}
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@db:5432/dekanat
      UNIVERSITY_TZ: Asia/Vladivostok
      PUBLIC_URL: https://${DOMAIN}
      STORAGE_DRIVER: disk
      STORAGE_DIR: /app/storage
      GIGACHAT_AUTH_KEY: ${GIGACHAT_AUTH_KEY:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
    volumes:
      - storage:/app/storage
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?нужен DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  pgdata:
  storage:
  caddy-data:
